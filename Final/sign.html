<!DOCTYPE html>

<head>

<title>Email Signature</title>

<style>
  :root {
    color-scheme: light dark;
    supported-color-schemes: light dark;
  }
  /* Force fixed layout */
  table { border-collapse: collapse; table-layout: fixed; }
  
  /* DARK MODE OVERRIDES */
  @media (prefers-color-scheme: dark) {
    .dark-bg { background-color: #ffffff !important; }
    .watermark { display: none !important; }
    /* Ensure text remains legible on the forced white background */
    .dark-text { color: #0d1f3c !important; }
    .name-text { color: #08145f !important; }
    .role-text { color: #1d65ff !important; }
    .border-fix { border-color: #d6dbe8 !important; }
    .divider-fix { border-left-color: #1478ff !important; }
  }

  /* Outlook.com / Web Dark Mode */
  [data-ogsc] .dark-bg { background-color: #ffffff !important; }
  [data-ogsc] .watermark { display: none !important; }
  [data-ogsc] .dark-text { color: #0d1f3c !important; }
  [data-ogsc] .name-text { color: #08145f !important; }
  [data-ogsc] .border-fix { border-color: #d6dbe8 !important; }
</style>
</head>

<body style="margin:0;padding:0;background:#ffffff;">

                  <table cellpadding="0" cellspacing="0" border="0" width="100%" class="dark-bg" style="border-collapse:collapse;">
