<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Signature</title>
<!--[if gte mso 9]><xml><o:OfficeDocumentSettings><o:AllowPNG/><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->
</head>

<body style="margin:0;padding:0;background:#ffffff;">

<table cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:720px;font-family:Arial, Helvetica, sans-serif;">

  <!-- Best Regards -->
  <tr>
    <td style="padding:14px 0 6px 20px;">
      <div style="
        font-size:36px;
        line-height:40px;
        color:#08145f;
        font-style:italic;
        font-weight:300;
        letter-spacing:-1px;
      ">
        Best regards,
      </div>
    </td>
  </tr>

  <!-- Top Name -->
  <tr>
    <td style="padding:0 0 10px 20px;">
      <div style="
        font-size:13px;
        letter-spacing:6px;
        color:#1d65ff;
        text-transform:uppercase;
        font-weight:500;
      ">
        HARON TOMA - FOUNDER &amp; CEO, SANIXPERTS
      </div>
    </td>
  </tr>

  <!-- Main Signature Box -->
  <tr>
    <td style="padding:0 10px 10px 10px;">

      <table cellpadding="0" cellspacing="0" border="0" width="100%" style="
        background:#f5f7fc;
        border-top:2px solid #0e6dff;
        border-left:4px solid #0e6dff;
        border-right:1px solid #d6dbe8;
        border-bottom:1px solid #d6dbe8;
      ">

        <tr>

          <!-- LEFT SIDE -->
          <td width="52%" valign="middle" style="padding:20px 16px;">

            <table cellpadding="0" cellspacing="0" border="0">
              <tr>

                <!-- PROFILE IMAGE -->
                <td valign="middle" style="padding-right:14px;">
                  <img
                    src="https://res.cloudinary.com/dydim1luz/image/upload/v1776991261/Photo_ntyfog.png"
                    width="90"
                    height="90"
                    style="
                      display:block;
                      width:90px;
                      height:90px;
                      border-radius:50%;
                      border:3px solid #14b7ff;
                      object-fit:cover;
                      object-position:center top;
                    "
                  >
                </td>

                <!-- CENTER CONTENT -->
                <td valign="middle">
                  <table cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="
                        border-left:2px solid #1478ff;
                        padding-left:18px;
                      ">

                        <!-- NAME -->
                        <div style="
                          font-size:34px;
                          line-height:36px;
                          font-weight:700;
                          color:#08145f;
                          margin-bottom:7px;
                          white-space:nowrap;
                        ">
                          Haron Toma
                        </div>

                        <!-- ROLE -->
                        <div style="
                          font-size:12px;
                          letter-spacing:7px;
                          color:#1d65ff;
                          text-transform:uppercase;
                          margin-bottom:8px;
                        ">
                          Founder / CEO
                        </div>

                        <!-- BRAND -->
                        <div style="
                          font-size:11px;
                          letter-spacing:6px;
                          color:#6675a5;
                          text-transform:uppercase;
                          margin-bottom:12px;
                        ">
                          SANI<span style="color:#145cff;font-weight:700;">X</span>PERTS
                        </div>

                        <!-- SIGNATURE -->
                        <table cellpadding="0" cellspacing="0" border="0">
                          <tr>
                            <td style="padding-top:8px;padding-left:4px;">
                              <img
                                src="https://res.cloudinary.com/dydim1luz/image/upload/e_bgremoval/v1778577028/image_pdfabm.png"
                                alt="Haron Toma Signature"
                                width="170"
                                style="display:block;width:170px;max-width:170px;height:auto;border:0;"
                                onerror="this.style.display='none'"
                              >
                            </td>
                          </tr>
                        </table>

                      </td>
                    </tr>
                  </table>
                </td>

              </tr>
            </table>

          </td>

          <!-- CENTER DIVIDER -->
          <td width="1" bgcolor="#d6dbe8"></td>

          <!-- RIGHT SIDE -->
          <td width="48%" valign="top" style="padding:24px 20px;">

            <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
              <tr>
                <!-- Contact Details Column -->
                <td valign="top" style="padding-right:10px;">

                  <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                    <!-- Phone Office -->
                    <tr>
                      <td width="32" style="padding-bottom:12px;vertical-align:middle;">
                        <img src="https://img.icons8.com/ios-filled/50/1a73e8/phone.png" width="18" height="18" style="display:block;" alt="Phone">
                      </td>
                      <td style="padding-bottom:12px;vertical-align:middle;">
                        <span style="font-family:Arial,sans-serif;font-size:13px;font-weight:600;color:#0d1f3c;">
                          (905) 971-2019
                        </span>
                      </td>
                    </tr>

                    <!-- Email -->
                    <tr>
                      <td width="32" style="padding-bottom:12px;vertical-align:middle;">
                        <img src="https://img.icons8.com/ios-filled/50/1a73e8/new-post.png" width="18" height="18" style="display:block;" alt="Email">
                      </td>
                      <td style="padding-bottom:12px;vertical-align:middle;">
                        <a href="mailto:haron@sanixperts.ca"
                           style="font-family:Arial,sans-serif;font-size:13px;font-weight:600;color:#1a73e8;text-decoration:none;">
                          haron@sanixperts.ca
                        </a>
                      </td>
                    </tr>

                    <!-- Mobile -->
                    <tr>
                      <td width="32" style="padding-bottom:12px;vertical-align:middle;">
                        <img src="https://img.icons8.com/ios-filled/50/1a73e8/iphone.png" width="18" height="18" style="display:block;" alt="Mobile">
                      </td>
                      <td style="padding-bottom:12px;vertical-align:middle;">
                        <span style="font-family:Arial,sans-serif;font-size:13px;font-weight:600;color:#0d1f3c;">
                          (289) 674-7265
                        </span>
                      </td>
                    </tr>

                    <!-- Website -->
                    <tr>
                      <td width="32" style="padding-bottom:12px;vertical-align:middle;">
                        <img src="https://img.icons8.com/ios-filled/50/1a73e8/domain.png" width="18" height="18" style="display:block;" alt="Website">
                      </td>
                      <td style="padding-bottom:12px;vertical-align:middle;">
                        <a href="https://www.SaniXperts.ca"
                           style="font-family:Arial,sans-serif;font-size:13px;font-weight:600;color:#1a73e8;text-decoration:none;">
                          www.SaniXperts.ca
                        </a>
                      </td>
                    </tr>

                    <!-- Address -->
                    <tr>
                      <td width="32" style="vertical-align:top;padding-top:2px;">
                        <img src="https://img.icons8.com/ios-filled/50/1a73e8/marker.png" width="18" height="18" style="display:block;" alt="Address">
                      </td>
                      <td style="vertical-align:middle;">
                        <span style="font-family:Arial,sans-serif;font-size:13px;font-weight:500;color:#0d1f3c;line-height:1.55;">
                          301-1632 Upper James St.<br/>Hamilton, ON L9B1K4
                        </span>
                      </td>
                    </tr>
                  </table>

                </td>

                <!-- Watermark Logo Column -->
                <td width="120" valign="middle" align="right" style="padding-left:5px;">
                  <img src="https://res.cloudinary.com/dydim1luz/image/upload/v1778585188/copy_of_logo_fnu8jh_89d8c1.png"
                       width="110" height="110"
                       style="display:block;width:110px;height:auto;"
                       alt="SaniXperts">
                </td>
              </tr>
            </table>

          </td>

        </tr>

      </table>

    </td>
  </tr>

</table>

</body>
</html>
