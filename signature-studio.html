<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaniXperts Signature Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --navy:#0a1e3d;--blue:#1a73e8;--teal:#00c4cc;
  --bg:#070d1c;--surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.07);--border2:rgba(26,115,232,0.3);
  --text:#dde8f8;--muted:#6a8cae;--input:rgba(0,0,0,0.35);
  --r:10px;
}
html{scroll-behavior:smooth;}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;top:-250px;right:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(26,115,232,0.07) 0%,transparent 65%);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;bottom:-250px;left:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(0,196,204,0.05) 0%,transparent 65%);pointer-events:none;z-index:0;}

/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--border);background:rgba(7,13,28,0.85);backdrop-filter:blur(24px);position:sticky;top:0;z-index:200;}
.hdr-logo{display:flex;align-items:center;gap:11px;}
.hdr-mark{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),var(--teal));border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;letter-spacing:-0.5px;}
.hdr-brand{font-size:16px;font-weight:700;letter-spacing:-0.2px;}
.hdr-brand em{font-style:normal;color:var(--teal);}
.hdr-tag{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:0.12em;text-transform:uppercase;}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 65px);}

/* ── Form Panel ── */
.form-panel{border-right:1px solid var(--border);overflow-y:auto;background:rgba(7,13,28,0.6);}
.form-panel::-webkit-scrollbar{width:4px;}
.form-panel::-webkit-scrollbar-track{background:transparent;}
.form-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

.fsec{padding:24px 28px;border-bottom:1px solid var(--border);}
.fsec-lbl{font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--teal);margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.fsec-lbl::after{content:'';flex:1;height:1px;background:var(--border);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:5px;letter-spacing:0.04em;}
.field input,.field select{width:100%;padding:9px 12px;background:var(--input);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:'Inter',sans-serif;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,115,232,.12);}
.field input::placeholder{color:rgba(106,140,174,.35);}
.field select{cursor:pointer;}
.field select option{background:#0d1827;color:var(--text);}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* Photo upload */
.photo-box{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--r);cursor:pointer;transition:all .2s;}
.photo-box:hover{background:var(--surface2);border-color:rgba(26,115,232,.5);}
.photo-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-size:22px;}
.photo-av img{width:100%;height:100%;object-fit:cover;}
.photo-txt strong{display:block;font-size:13px;color:var(--text);margin-bottom:2px;font-weight:600;}
.photo-txt span{font-size:11px;color:var(--muted);}

/* ── Preview Panel ── */
.preview-panel{overflow-y:auto;padding:32px 40px;background:rgba(7,13,28,0.3);}
.preview-panel::-webkit-scrollbar{width:4px;}
.preview-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* Template picker */
.tpl-hdr{font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--teal);margin-bottom:14px;}
.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px;}
.tpl-card{padding:8px 6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;text-align:center;transition:all .2s;user-select:none;}
.tpl-card:hover{background:var(--surface2);border-color:rgba(26,115,232,.4);}
.tpl-card.on{border-color:var(--blue);background:rgba(26,115,232,.1);box-shadow:0 0 0 1px rgba(26,115,232,.3);}
.tpl-thumb{height:38px;border-radius:6px;margin-bottom:7px;overflow:hidden;position:relative;}
.tpl-name{font-size:10px;font-weight:600;color:var(--text);}

/* Preview box */
.sig-box{background:#fff;border-radius:14px;padding:36px 36px;box-shadow:0 20px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);margin-bottom:22px;overflow-x:auto;}

/* Action bar */
.actions{display:flex;gap:10px;flex-wrap:wrap;}
.btn{padding:10px 20px;border-radius:9px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:7px;transition:all .2s;text-decoration:none;}
.btn svg{flex-shrink:0;}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 8px 22px rgba(26,115,232,.35);}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--surface2);}

/* Toast */
.toast{position:fixed;bottom:28px;right:28px;padding:13px 20px;background:rgba(0,196,204,.12);border:1px solid rgba(0,196,204,.4);border-radius:11px;color:var(--teal);font-size:13px;font-weight:600;backdrop-filter:blur(20px);transform:translateY(16px);opacity:0;transition:all .3s;z-index:999;pointer-events:none;}
.toast.on{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">
    <div class="hdr-mark">SX</div>
    <div class="hdr-brand">Sani<em>Xperts</em></div>
  </div>
  <div class="hdr-tag">Signature Studio</div>
</header>

<div class="layout">

  <!-- ═══ FORM PANEL ═══ -->
  <div class="form-panel">

    <div class="fsec">
      <div class="fsec-lbl">Identity</div>
      <div class="frow">
        <div class="field"><label>First Name</label><input id="fn" type="text" placeholder="First" value="Haron"></div>
        <div class="field"><label>Last Name</label><input id="ln" type="text" placeholder="Last" value="Toma"></div>
      </div>
      <div class="field"><label>Job Title</label><input id="tt" type="text" placeholder="Founder & CEO" value="Founder &amp; CEO"></div>
      <div class="field"><label>Company</label><input id="co" type="text" placeholder="SaniXperts" value="SaniXperts"></div>
    </div>

    <div class="fsec">
      <div class="fsec-lbl">Contact</div>
      <div class="field"><label>Phone</label><input id="ph" type="text" placeholder="+1 (555) 000-0000" value="+1 (905) 971-2019"></div>
      <div class="field"><label>Email</label><input id="em" type="email" placeholder="you@company.com" value="haron@sanixperts.ca"></div>
      <div class="field"><label>Address</label><input id="ad" type="text" placeholder="City, Province" value="Hamilton, ON L9B1K4"></div>
      <div class="field"><label>Website</label><input id="ws" type="text" placeholder="www.company.com" value="www.SaniXperts.ca"></div>
    </div>

    <div class="fsec">
      <div class="fsec-lbl">Social Media</div>
      <div class="field"><label>LinkedIn URL</label><input id="li" type="text" placeholder="https://linkedin.com/in/..."></div>
      <div class="field"><label>Instagram URL</label><input id="ig" type="text" placeholder="https://instagram.com/..."></div>
      <div class="field"><label>Facebook URL</label><input id="fb" type="text" placeholder="https://facebook.com/..."></div>
    </div>

    <div class="fsec">
      <div class="fsec-lbl">Profile Photo</div>
      <div class="photo-box" id="photoDrop" onclick="document.getElementById('photoFile').click()">
        <div class="photo-av" id="photoAv">👤</div>
        <div class="photo-txt">
          <strong>Upload Photo</strong>
          <span>Click to browse — JPG, PNG, WebP</span>
        </div>
      </div>
      <input id="photoFile" type="file" accept="image/*" style="display:none">
    </div>

    <div class="fsec">
      <div class="fsec-lbl">Tagline</div>
      <div class="field"><label>Company Tagline (optional)</label><input id="tg" type="text" placeholder="Professional Sanitation Excellence" value="Professional Sanitation Excellence"></div>
    </div>

    <div class="fsec">
      <div class="fsec-lbl">Best Regards Line</div>
      <div class="field"><label>Name (optional)</label><input id="brn" type="text" placeholder="e.g. Haron Toma" value="Haron Toma"></div>
      <div class="field"><label>Position (optional)</label><input id="brp" type="text" placeholder="e.g. Founder &amp; CEO" value="Founder &amp; CEO"></div>
      <div class="field"><label>Company (optional)</label><input id="brc" type="text" placeholder="e.g. SaniXperts" value="SaniXperts"></div>
    </div>

  </div>

  <!-- ═══ PREVIEW PANEL ═══ -->
  <div class="preview-panel">

    <div class="tpl-hdr">Select Template</div>

    <div class="tpl-grid">
      <div class="tpl-card on" data-t="vanguard" onclick="pick('vanguard',this)">
        <div class="tpl-thumb" style="background:linear-gradient(100deg,#0a1e3d 0%,#0a1e3d 45%,#f7fafd 45%);"></div>
        <div class="tpl-name">Vanguard</div>
      </div>
      <div class="tpl-card" data-t="lumina" onclick="pick('lumina',this)">
        <div class="tpl-thumb" style="background:#fff;border:1px solid #dde8f8;box-shadow:0 2px 8px rgba(10,30,61,.06);">
          <div style="position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#00c4cc,#1a73e8);"></div>
        </div>
        <div class="tpl-name">Lumina</div>
      </div>
      <div class="tpl-card" data-t="horizon" onclick="pick('horizon',this)">
        <div class="tpl-thumb" style="background:#fff;border:1px solid #e8f0fa;">
          <div style="position:absolute;bottom:6px;left:0;right:0;height:2px;background:linear-gradient(90deg,#1a73e8,#00c4cc);"></div>
        </div>
        <div class="tpl-name">Horizon</div>
      </div>
      <div class="tpl-card" data-t="zenith" onclick="pick('zenith',this)">
        <div class="tpl-thumb" style="background:linear-gradient(180deg,#0a1e3d 50%,#fff 50%);border:1px solid #cdd8e8;">
          <div style="position:absolute;top:50%;left:0;right:0;height:2px;background:linear-gradient(90deg,#00c4cc,#1a73e8);transform:translateY(-1px);"></div>
        </div>
        <div class="tpl-name">Zenith</div>
      </div>
      <div class="tpl-card" data-t="slim" onclick="pick('slim',this)">
        <div class="tpl-thumb" style="background:#f7fafd;border:1px solid #dce8f5;border-left:3px solid #1a73e8;">
          <div style="position:absolute;top:8px;left:0;right:0;height:2px;background:linear-gradient(90deg,#00c4cc,#1a73e8,#00c4cc);"></div>
        </div>
        <div class="tpl-name">Slim</div>
      </div>
      <div class="tpl-card" data-t="wave" onclick="pick('wave',this)">
        <div class="tpl-thumb" style="background:#f7fafd;border:1px solid #dce8f5;border-left:3px solid #00c4cc;overflow:hidden;">
          <div style="position:absolute;bottom:0;left:0;right:0;height:10px;background:linear-gradient(90deg,#1a73e8,#00c4cc,#0a1e3d);clip-path:ellipse(55% 100% at 50% 100%);"></div>
        </div>
        <div class="tpl-name">Wave</div>
      </div>
      <div class="tpl-card" data-t="meridian" onclick="pick('meridian',this)">
        <div class="tpl-thumb" style="background:#f7fafd;border:1px solid #dce8f5;">
          <div style="position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#00c4cc,#1a73e8,#00c4cc);"></div>
          <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#00c4cc,#1a73e8,#00c4cc);"></div>
        </div>
        <div class="tpl-name">Meridian</div>
      </div>
      <div class="tpl-card" data-t="aqua" onclick="pick('aqua',this)">
        <div class="tpl-thumb" style="background:#f0f8ff;border:1px solid #d0e8f8;overflow:hidden;">
          <div style="position:absolute;top:0;left:0;width:38%;height:100%;background:linear-gradient(180deg,#e3f2fd,#bbdefb);border-right:1px solid #29abe2;"></div>
          <div style="position:absolute;bottom:0;left:0;right:0;height:10px;background:linear-gradient(90deg,#0d47a1,#29abe2,#0d47a1);clip-path:ellipse(55% 100% at 50% 100%);"></div>
        </div>
        <div class="tpl-name">Aqua</div>
      </div>
    </div>

    <div class="sig-box">
      <div id="preview"></div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="copyHTML()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copy Signature HTML
      </button>
      <button class="btn btn-ghost" onclick="previewTab()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Preview in Tab
      </button>
      <button class="btn btn-ghost" onclick="download()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download .html
      </button>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ─── Brand assets ─────────────────────────────────────────────────────────
const LOGO_URL  = 'https://res.cloudinary.com/dydim1luz/image/upload/v1776991261/Logo_fnu8jh.png';
const PHOTO_URL = 'https://res.cloudinary.com/dydim1luz/image/upload/v1776991261/Photo_ntyfog.png';

// ─── State ───────────────────────────────────────────────────────────────
let activeTpl = 'vanguard';
let photoData = null;

// ─── Data ────────────────────────────────────────────────────────────────
const D = () => ({
  fn: v('fn'), ln: v('ln'), tt: v('tt'), co: v('co'),
  ph: v('ph'), em: v('em'), ad: v('ad'), ws: v('ws'),
  li: v('li'), ig: v('ig'), fb: v('fb'), tg: v('tg'),
  brn: v('brn'), brp: v('brp'), brc: v('brc'),
  photo: photoData,
});
const v = id => document.getElementById(id).value.trim();

// ─── SVG icons as data URIs ───────────────────────────────────────────────
function ic(path, color='%231a73e8', w=14, h=14) {
  return `data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 24 24' fill='none' stroke='${color}' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E${path}%3C/svg%3E`;
}
const ICONS = {
  phone: ic("%3Cpath d='M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 10.8a19.79 19.79 0 01-3.07-8.63A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z'/%3E"),
  email: ic("%3Cpath d='M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z'/%3E%3Cpolyline points='22,6 12,13 2,6'/%3E"),
  pin:   ic("%3Cpath d='M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z'/%3E%3Ccircle cx='12' cy='10' r='3'/%3E"),
  globe: ic("%3Ccircle cx='12' cy='12' r='10'/%3E%3Cline x1='2' y1='12' x2='22' y2='12'/%3E%3Cpath d='M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z'/%3E"),
};

function socialSVG(type) {
  const map = {
    li: `%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='%230077B5'%3E%3Cpath d='M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z'/%3E%3Ccircle cx='4' cy='4' r='2'/%3E%3C/svg%3E`,
    ig: `%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23E1306C' stroke-width='2'%3E%3Crect x='2' y='2' width='20' height='20' rx='5' ry='5'/%3E%3Cpath d='M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z'/%3E%3Cline x1='17.5' y1='6.5' x2='17.51' y2='6.5'/%3E%3C/svg%3E`,
    fb: `%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='%231877F2'%3E%3Cpath d='M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z'/%3E%3C/svg%3E`,
  };
  return `data:image/svg+xml;charset=utf-8,${map[type]}`;
}

function avatar() { return PHOTO_URL; }

// ─── Contact row helper ───────────────────────────────────────────────────
function cRow(iconSrc, content) {
  return `<tr>
    <td width="20" style="padding-bottom:5px;padding-right:7px;vertical-align:middle;">
      <img src="${iconSrc}" width="14" height="14" style="display:block;"/>
    </td>
    <td style="padding-bottom:5px;vertical-align:middle;">${content}</td>
  </tr>`;
}

// ─── Social icons row ─────────────────────────────────────────────────────
function socialRow(d, bgLight=true) {
  const bg = bgLight ? '#e4eef8' : 'rgba(255,255,255,0.12)';
  const border = bgLight ? 'border:1px solid #c0d8f0;' : '';
  let cells = '';
  if(d.li) cells += `<td style="padding-right:5px;"><a href="${d.li}"><table cellpadding="0" cellspacing="0"><tr><td width="24" height="24" align="center" valign="middle" style="background:${bg};${border}border-radius:50%;width:24px;height:24px;"><img src="${socialSVG('li')}" width="12" height="12" style="display:block;margin:0 auto;"/></td></tr></table></a></td>`;
  if(d.ig) cells += `<td style="padding-right:5px;"><a href="${d.ig}"><table cellpadding="0" cellspacing="0"><tr><td width="24" height="24" align="center" valign="middle" style="background:${bg};${border}border-radius:50%;width:24px;height:24px;"><img src="${socialSVG('ig')}" width="12" height="12" style="display:block;margin:0 auto;"/></td></tr></table></a></td>`;
  if(d.fb) cells += `<td><a href="${d.fb}"><table cellpadding="0" cellspacing="0"><tr><td width="24" height="24" align="center" valign="middle" style="background:${bg};${border}border-radius:50%;width:24px;height:24px;"><img src="${socialSVG('fb')}" width="12" height="12" style="display:block;margin:0 auto;"/></td></tr></table></a></td>`;
  if(!cells) return '';
  return `<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr>${cells}</tr></table>`;
}

// ─── Logo mark ────────────────────────────────────────────────────────────
function logoMark(size=62) {
  return LOGO_URL;
}

function brSubline(d, color='#1a73e8', size='9.5px') {
  const right = [d.brp, d.brc].filter(Boolean).join(', ');
  const parts  = [d.brn, right].filter(Boolean).join(' &nbsp;&#183;&nbsp; ');
  if (!parts) return '';
  return `<p style="margin:0;font-family:Arial,sans-serif;font-size:${size};font-weight:600;color:${color};letter-spacing:0.2em;text-transform:uppercase;">${parts}</p>`;
}

function tagX(size=9, textColor='#3a5070', xColor='#87CEEB') {
  const xSize = Math.round(size * 2.7);
  return `<span style="font-family:Arial,sans-serif;font-size:${size}px;font-weight:700;color:${textColor};letter-spacing:0.11em;text-transform:uppercase;line-height:1.4;">&#9670;&nbsp;CLEANING MEETS QUALITY. REDEFINED BY THE<span style="font-size:${xSize}px;font-weight:900;font-style:italic;color:${xColor};line-height:0.75;vertical-align:middle;letter-spacing:-0.02em;">X</span>PERTS.</span>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// TEMPLATE 1 — VANGUARD (dark left column + light right)
// ═══════════════════════════════════════════════════════════════════════════
function tplVanguard(d) {
  const photo = d.photo || avatar();
  return `

// ─── Template map ──────────────────────────────────────────────────────────
const TPL = {
  vanguard: tplVanguard,
  lumina:   tplLumina,
  horizon:  tplHorizon,
  zenith:   tplZenith,
  slim:     tplSlim,
  wave:     tplWave,
  meridian: tplMeridian,
  aqua:     tplAqua,
};

// ─── Render ────────────────────────────────────────────────────────────────
function render() {
  document.getElementById('preview').innerHTML = TPL[activeTpl](D());
}

function pick(name, el) {
  activeTpl = name;
  document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  render();
}

// ─── Actions ───────────────────────────────────────────────────────────────
function copyHTML() {
  navigator.clipboard.writeText(TPL[activeTpl](D())).then(() => toast('✓ Signature HTML copied to clipboard!'));
}

function previewTab() {
  const w = window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Signature Preview</title><style>body{background:#f0f4fa;display:flex;align-items:flex-start;justify-content:center;padding:48px;font-family:Arial,sans-serif;}</style></head><body>${TPL[activeTpl](D())}</body></html>`);
  w.document.close();
}

function download() {
  const d = D();
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${d.fn} ${d.ln} — Email Signature</title></head><body style="padding:48px;background:#f4f7fc;">${TPL[activeTpl](d)}</body></html>`;
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([html],{type:'text/html'})),
    download: `${d.fn}_${d.ln}_signature_${activeTpl}.html`,
  });
  a.click();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('on'), 3000);
}

// ─── Photo upload ──────────────────────────────────────────────────────────
document.getElementById('photoFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    photoData = ev.target.result;
    document.getElementById('photoAv').innerHTML = `<img src="${photoData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>`;
    render();
  };
  reader.readAsDataURL(file);
});

// ─── Live form binding ─────────────────────────────────────────────────────
['fn','ln','tt','co','ph','em','ad','ws','li','ig','fb','tg','brn','brp','brc'].forEach(id =>
  document.getElementById(id).addEventListener('input', render)
);

// ─── Boot ──────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
